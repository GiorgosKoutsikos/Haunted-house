<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Haunted Escape</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <!-- Status Bar: Sanity Score -->
      <header class="status-bar">
        <span>
          Sanity:
          <strong id="sanity-value">100</strong>
          %
        </span>
      </header>

      <!-- Scene Area -->
      <main class="scene-card">
        <h1 id="scene-title">Loading...</h1>
        <p id="scene-description">Preparing your nightmare...</p>

        <!-- Buttons for Choices -->
        <div id="choices-container" class="choices-list">
          <!-- JavaScript Buttons -->
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
